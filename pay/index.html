<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07101c">
<title>Resultary checkout</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/site-v2.css">
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script src="/pay/config.js"></script>
<script src="/pay/checkout.js" defer></script>
<style>
.checkout-shell{min-height:100vh;display:grid;place-items:center;padding:42px 22px}
.checkout-card{width:min(100%,680px);padding:38px;border:1px solid rgba(143,177,214,.35);border-radius:22px;background:linear-gradient(145deg,#14283f,#0c1b2d);box-shadow:0 30px 80px rgba(0,0,0,.28)}
.checkout-card h1{font-size:clamp(2.1rem,6vw,3.5rem);margin:0 0 16px;line-height:1.05}
.checkout-card p{color:#b6c8db;line-height:1.75}
.checkout-status{margin-top:22px;padding:14px 16px;border:1px solid rgba(140,178,210,.25);border-radius:12px;background:#0a1727;color:#c9d7e6}
.checkout-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;color:#92a9c0;font-size:.82rem}
.checkout-meta span{padding:7px 10px;border:1px solid rgba(142,177,210,.19);border-radius:999px}
</style>
</head>
<body class="site-v2">
<main class="checkout-shell">
<section class="checkout-card" aria-labelledby="checkout-title">
<a class="brand" href="/" aria-label="Resultary home"><span class="mark">R</span><span>resultary<span class="brand-dot">.</span></span></a>
<h1 id="checkout-title">Start your Resultary trial</h1>
<p>15 days free, then your monthly Resultary subscription continues automatically unless you cancel before the trial ends.</p>
<div class="checkout-meta"><span>15-day free trial</span><span>Payment method required</span><span>$29/month after trial</span></div>
<p id="checkout-status" class="checkout-status" role="status" aria-live="polite">Preparing secure checkout…</p>
</section>
</main>
</body>
</html>
