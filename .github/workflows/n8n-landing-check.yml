name: Resultary n8n landing checks
on:
  push:
    branches: [main]
    paths: ['n8n/**', 'start/**', 'integrations/index.html', 'index.html', 'product/**', 'trust/**', 'docs/**', 'faq/**', 'security/**', 'privacy/**', 'terms/**', 'support/**', '404.html', 'site-v2.css', 'sitemap.xml', '.github/workflows/n8n-landing-check.yml']
  pull_request:
    paths: ['n8n/**', 'start/**', 'integrations/index.html', 'index.html', 'product/**', 'trust/**', 'docs/**', 'faq/**', 'security/**', 'privacy/**', 'terms/**', 'support/**', '404.html', 'site-v2.css', 'sitemap.xml', '.github/workflows/n8n-landing-check.yml']
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check n8n/apply.js
      - run: node --test n8n/*.test.mjs
